:root {
  --zemin: #121110;
  --panel: #191816;
  --alan: #0d0c0b;
  --levha: #151412;
  --cizgi: rgb(236 230 218 / .10);
  --cizgi-2: rgb(236 230 218 / .20);
  --murekkep: #ece6da;
  --soluk: #a39e94;
  --turuncu: #ff6a2b;
  --nane: #8fd9b0;
  --kirmizi: #ff5c57;
  --yazi: "Hanken Grotesk", system-ui, sans-serif;
  --olcu: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --hizli: 180ms cubic-bezier(.16, 1, .3, 1);
  --r: 3px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--zemin); color: var(--murekkep); font: 400 1rem/1.5 var(--yazi); -webkit-font-smoothing: antialiased; }
::selection { background: var(--turuncu); color: var(--zemin); }
:focus-visible { outline: 2px solid var(--turuncu); outline-offset: 2px; }
a { color: inherit; text-underline-offset: .2em; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Üst çubuk (sira.html ile aynı) */
.ust { position: sticky; top: 0; z-index: 5; height: 64px; flex: none; display: flex; align-items: center; gap: 2rem; padding: 0 clamp(1rem, 3vw, 2.5rem); background: rgb(18 17 16 / .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--cizgi); }
.marka { display: flex; align-items: center; gap: .625rem; font-weight: 600; font-size: 1.1875rem; text-decoration: none; }
.marka svg { width: 26px; height: 26px; color: var(--turuncu); }
.marka small { font-weight: 400; font-size: .875rem; color: var(--soluk); }
.ust nav { display: flex; gap: 1.5rem; margin-left: auto; font-size: .9375rem; }
.ust nav a { text-decoration: none; color: var(--soluk); transition: color var(--hizli); }
.ust nav a:hover, .ust nav a[aria-current="page"] { color: var(--murekkep); }
.dugme { display: inline-flex; align-items: center; gap: .5rem; height: 40px; padding: 0 1.125rem; border-radius: 999px; border: 1px solid var(--cizgi-2); background: transparent; color: var(--murekkep); font: 600 .9375rem var(--yazi); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background var(--hizli), border-color var(--hizli), transform var(--hizli); }
.dugme:hover { border-color: var(--murekkep); }
.dugme.ana { background: var(--turuncu); border-color: var(--turuncu); color: #140c08; }
.dugme.ana:hover { background: #ff7d45; }

/* Sunum: 3B görünüm üst çubuğun altındaki bütün alanı kaplar */
main { flex: 1; min-height: 0; display: flex; }
#bina { flex: 1; min-height: 420px; }

@media (max-width: 960px) {
  .ust { flex-wrap: wrap; height: auto; padding-top: .625rem; row-gap: .125rem; }
  .ust nav { order: 3; flex-basis: 100%; margin-left: 0; gap: 1.25rem; overflow-x: auto; padding-bottom: .625rem; white-space: nowrap; scrollbar-width: none; }

}

<script type="module">
// Sunum sayfası: kayıtlı projeyi (Döşemeden temele / Tablo ile aynı localStorage durumu) okur, düzenlemez. Hesap işçide;
// işçi kurulamazsa eşzamanlı. Başka sekmede proje değişince yeniden çizer.
import { kur } from './bina3b.js';
import { durumYukle, girdiOku, ANAHTAR } from './calisma.js';
import { girdiDenetle, zincirHesap } from './zincir.js';

const b3 = kur(document.getElementById('bina'), { tam: true });
const goster = (sonuc, g) => { cizildi = true; b3.guncelle(sonuc, g); };
const isciKur = () => { try { return new Worker(new URL('./hesap-isci.js', import.meta.url), { type: 'module' }); } catch { return null; } };
let isci = isciKur(), sira = 0, cizildi = false, ucusta = false;
function hesapla() {
  const id = ++sira; // önce: girdi hatası da uçuştaki eski yanıtı geçersiz kılsın
  const g = girdiOku(durumYukle(undefined, false)), hata = girdiDenetle(g);
  if (Object.keys(hata).length) { cizildi = false; return b3.hata('Projede girdi hatası var. Döşemeden temele sayfasında düzeltince burada görünür.'); }
  if (!cizildi) b3.hata('Hesaplanıyor…');
  if (isci && ucusta) { isci.terminate(); isci = isciKur(); } // eski girdinin hesabı boşa sürmesin (art arda değişiklik)
  if (!isci) return goster(zincirHesap(g), g);
  ucusta = true;
  isci.onmessage = ({ data }) => { if (data.id !== sira) return; ucusta = false; data.hata ? (console.error(data.hata), b3.hata('Hesap tamamlanamadı.')) : goster(data.sonuc, g); };
  isci.onerror = e => { e.preventDefault?.(); isci = null; if (id === sira) goster(zincirHesap(g), g); };
  isci.postMessage({ id, g });
}
addEventListener('storage', e => { if (e.key === ANAHTAR) hesapla(); });
hesapla();
</script>
